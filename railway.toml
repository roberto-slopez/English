# Railway configuration. Keep this file at the repo root and Railway
# picks it up automatically when you deploy.
#
# Stack summary: Astro 6 (SSR, Node adapter, standalone) + React 19 +
# Framer Motion + Postgres via the `pg` driver. Node 22 LTS, package
# manager pnpm 10. The build is driven by the multi-stage Dockerfile
# in this directory.
#
# Database: Postgres is provided by the Railway Postgres plugin. Link
# the SSR service to the plugin and the `DATABASE_URL` env var is set
# automatically. If you skip the link, set `DATABASE_URL` manually on
# the SSR service's Variables tab. There is no on-disk database — the
# runtime talks to the network DB on every request.

[build]
builder = "DOCKERFILE"
dockerfilePath = "./Dockerfile"

[deploy]
# Matches the CMD in the Dockerfile — declared here too so the entry
# point is visible at a glance in the Railway dashboard and is easy to
# tweak without rebuilding the image.
startCommand = "node ./dist/server/entry.mjs"

# Healthcheck: hit the landing page. If the SSR runtime is up and the
# Postgres bootstrap completed, the response will be a 200 (or 304). Any
# 5xx flips the instance to unhealthy and triggers a restart.
healthcheckPath = "/"
healthcheckTimeout = 30

# Restart on crash, but cap the retries so a broken image doesn't burn
# the monthly restart budget. A successful healthcheck resets the counter.
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
